name: BusinessNewsroom Scheduler

on:
  schedule:
    # Bangladesh time 07:00-23:00 hourly = UTC 01:00-17:00
    - cron: '0 1-17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: businessnewsroom-hourly
  cancel-in-progress: false

jobs:
  publish-news:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run BusinessNewsroom bot
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: '@BusinessNewsroom'
          NEWS_MODE: update
        run: python main.py

      - name: Commit updated state files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news_state.json posted_urls.txt
          if git diff --cached --quiet; then
            echo "No state changes to commit"
            exit 0
          fi
          git commit -m "chore: update BusinessNewsroom state"
          git push
