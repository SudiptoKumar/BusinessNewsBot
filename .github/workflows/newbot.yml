name: BusinessNewsroom V1

on:
  schedule:
    # Bangladesh Time (Asia/Dhaka)
    # Runs at :50 minutes past every hour
    # 7:50 PM, 8:05 PM, 8:20 PM, 8:35 PM, 8:50 PM BDT
    - cron: "50 19 * * *"
      timezone: "Asia/Dhaka"
    
    - cron: "5 20 * * *"
      timezone: "Asia/Dhaka"
    
    - cron: "20 20 * * *"
      timezone: "Asia/Dhaka"
    
    - cron: "35 20 * * *"
      timezone: "Asia/Dhaka"
    
    - cron: "50 20 * * *"
      timezone: "Asia/Dhaka"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: businessnewsroom-v1
  cancel-in-progress: false

jobs:
  run-news-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      TELEGRAM_CHANNEL: "@BusinessNewsroom"
      NEWS_MODE: "update"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python source
        run: |
          python -m py_compile main.py

      - name: Run self-test
        run: |
          python main.py --self-test

      - name: Run BusinessNewsroom
        run: |
          echo "========================================"
          echo "BusinessNewsroom V1"
          echo "Mode: update"
          echo "Lookback: 24 hours"
          echo "Target: 3 Bangladesh + 3 International"
          echo "Schedule: 7:50 PM, 8:05 PM, 8:20 PM, 8:35 PM, 8:50 PM BDT"
          echo "Channel: @BusinessNewsroom"
          echo "========================================"

          python main.py

      - name: Save state
        if: always()
        run: |
          git config user.name "BusinessNews Bot"
          git config user.email "actions@github.com"

          git add news_state.json posted_urls.txt

          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update BusinessNewsroom state"
            git push
          fi
