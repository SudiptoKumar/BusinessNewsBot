name: BusinessNewsroom V1

on:
  workflow_dispatch:

  schedule:
    - cron: "5 2-17 * * *"

permissions:
  contents: write

jobs:
  run-news-bot:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run BusinessNewsroom V1
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "@BusinessNewsroom"
          NEWS_MODE: "update"
          PYTHONUNBUFFERED: "1"
        run: |
          python main.py

      - name: Save bot state
        run: |
          git config user.name "BusinessNews Bot"
          git config user.email "actions@github.com"

          git add posted_urls.txt news_state.json

          git diff --cached --quiet || git commit -m "Update BusinessNewsroom state"

          git push
